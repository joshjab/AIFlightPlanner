# Simple Nginx config for serving a Vite app and proxying an API
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # --- API Proxy ---
        # All requests to /api/... will be forwarded to the 'backend' service
        # 'backend' is the service name from docker-compose.yml
        location /api/ {
            proxy_pass http://backend:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- React App (SPA) ---
        # Serve the static files from the build
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html; # This line is key for SPAs
        }
    }
}
