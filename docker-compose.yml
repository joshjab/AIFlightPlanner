version: '3.8'

services:
  backend:
    build:
      # Build from the project root, using the backend Dockerfile
      context: .
      dockerfile: backend/Dockerfile
    # Run the app using its full package path
    command: gunicorn -w 4 -k uvicorn.workers.UvicornWorker backend.main:app -b 0.0.0.0:8003
    volumes:
      # Mount the backend folder for hot-reloading code changes
      - ./backend:/app/backend
    environment:
      PYTHONUNBUFFERED: 1
    # No port expose needed, handled by frontend

  frontend:
    build: ./frontend
    ports:
      # Use port 8040 as requested
      - "127.0.0.1:8040:80"
    depends_on:
      - backend

networks:
  default:
    driver: bridge

